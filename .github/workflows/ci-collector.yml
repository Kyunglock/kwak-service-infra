# collector 검사 (pytest)
#
# Ruff 는 넣지 않았다. 기존 코드에 기본 룰셋 기준 190건 넘는 위반이 있어
# 도입하려면 소스를 전면 정리해야 하는데, 그 정리를 하지 않기로 했다.
name: CI (collector)

on:
  workflow_call:
    inputs:
      python-version:
        description: Dockerfile 의 python:3.11-slim 과 맞춘다
        type: string
        default: '3.11'

# GITHUB_TOKEN 은 읽기만 있으면 된다. 이 워크플로들은 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt 가 requirements.txt 를 포함한다.
      # 테스트가 api_internal(fastapi) 를 import 하므로 런타임 의존성도 필요하다.
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # test_pipeline.py / test_stock_scheduler.py 는 진단 스크립트라
      # pyproject.toml 에서 수집 대상에서 빠져 있다.
      - name: pytest
        run: pytest -q
