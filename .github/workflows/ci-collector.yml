# collector 검사 (Ruff / pytest)
name: CI (collector)

on:
  workflow_call:
    inputs:
      python-version:
        description: Dockerfile 의 python:3.11-slim 과 맞춘다
        type: string
        default: '3.11'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt 가 requirements.txt 를 포함한다.
      # 테스트가 api_internal(fastapi) 를 import 하므로 런타임 의존성도 필요하다.
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # test_pipeline.py / test_stock_scheduler.py 는 진단 스크립트라
      # pyproject.toml 에서 수집 대상에서 빠져 있다.
      - name: pytest
        run: pytest -q
