# kwak-service-fe E2E 스모크 (Playwright)
#
# 수동 실행 전용이다. 호출하는 쪽(fe 의 e2e.yml)이 workflow_dispatch 로만 걸려 있다.
# 브라우저를 띄우느라 평소 검사보다 느리고, 매 push 마다 돌릴 만큼 자주 깨지는
# 영역도 아니라서 게이트로 두지 않았다.
#
# 백엔드는 띄우지 않는다. 쿠키가 없으면 AuthContext 가 API 를 호출하지 않고
# isLoggedIn=false 로 끝나므로, 인증이 필요 없는 화면과 리다이렉트·에러 처리는
# 백엔드 없이 결정적으로 검증된다.
name: E2E (frontend)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # package.json 에 고정된 @playwright/test 버전에 맞는 브라우저만 받는다.
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 의 webServer 가 npm run preview 로 dist 를 띄운다.
      - name: E2E 실행
        run: npm run test:e2e

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
