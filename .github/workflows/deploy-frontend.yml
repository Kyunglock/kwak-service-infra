# kwak-service-fe 배포 (self-hosted 러너에서 docker build + run)
name: Deploy (frontend)

on:
  workflow_call:
    inputs:
      image:
        type: string
        default: inv-fe:latest
      container:
        type: string
        default: inv-fe
      port:
        description: 호스트 포트:컨테이너 포트
        type: string
        default: '80:80'

# 같은 서비스 배포가 겹치면 컨테이너를 서로 죽인다.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # checkout 은 untracked 파일을 지우지 않으므로, 러너에 남은 옛 파일 때문에
      # "레포에는 없는데 빌드는 되는" 상태가 생긴다. 필요한 파일은 명시적으로 확인한다.
      - name: 필요한 파일 확인
        run: |
          missing=0
          for f in Dockerfile nginx.conf package.json vite.config.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::$f 가 레포에 없습니다."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: 이미지 빌드
        run: docker build -t "${{ inputs.image }}" .

      - name: 컨테이너 교체
        run: |
          docker stop "${{ inputs.container }}" 2>/dev/null || true
          docker rm "${{ inputs.container }}" 2>/dev/null || true
          docker run -d \
            --name "${{ inputs.container }}" \
            --restart unless-stopped \
            -p "${{ inputs.port }}" \
            "${{ inputs.image }}"

      - name: 기동 확인
        run: |
          sleep 5
          docker ps --filter "name=^${{ inputs.container }}$" --format '{{.Names}} {{.Status}}'
          docker inspect -f '{{.State.Running}}' "${{ inputs.container }}" | grep -q true

      - name: 사용하지 않는 이미지 정리
        if: always()
        run: docker image prune -f
