# kwak-service-fe 배포 (self-hosted 러너에서 docker build + run)
name: Deploy (frontend)

on:
  workflow_call:
    inputs:
      image:
        type: string
        default: inv-fe:latest
      container:
        type: string
        default: inv-fe
      port:
        description: 호스트 포트:컨테이너 포트
        type: string
        default: '80:80'

# 같은 서비스 배포가 겹치면 컨테이너를 서로 죽인다.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

# GITHUB_TOKEN 은 읽기만 있으면 된다. 이 워크플로들은 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # checkout 은 기본으로 git clean -ffdx 를 돌려 작업공간을 비운다.
      # 즉 러너에 수동으로 만들어 둔 파일은 남지 않는다 — 레포에 없으면 여기서 없다.
      # 배포가 애매한 docker 에러로 죽지 않도록 먼저 크게 실패시킨다.
      - name: 필요한 파일 확인
        run: |
          missing=0
          for f in Dockerfile nginx.conf package.json vite.config.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::$f 가 레포에 없습니다."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: 이미지 빌드
        run: docker build -t "${{ inputs.image }}" .

      - name: 컨테이너 교체
        run: |
          docker stop "${{ inputs.container }}" 2>/dev/null || true
          docker rm "${{ inputs.container }}" 2>/dev/null || true
          docker run -d \
            --name "${{ inputs.container }}" \
            --restart unless-stopped \
            -p "${{ inputs.port }}" \
            "${{ inputs.image }}"

      - name: 기동 확인
        run: |
          sleep 5
          docker ps --filter "name=^${{ inputs.container }}$" --format '{{.Names}} {{.Status}}'
          docker inspect -f '{{.State.Running}}' "${{ inputs.container }}" | grep -q true

      - name: 사용하지 않는 이미지 정리
        if: always()
        run: docker image prune -f
