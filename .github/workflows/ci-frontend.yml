# kwak-service-fe 검사 (ESLint / 타입체크 / 프로덕션 빌드)
#
# GitHub 호스팅 러너에서만 돈다. self-hosted 에서 돌리면 안 된다 —
# fe 는 public 레포라 fork PR 이 self-hosted 러너에서 임의 코드를 실행할 수 있다.
name: CI (frontend)

on:
  workflow_call:
    inputs:
      node-version:
        description: 빌드에 사용할 Node 버전 (Dockerfile 의 node:20-alpine 과 맞춘다)
        type: string
        default: '20'

# GITHUB_TOKEN 은 읽기만 있으면 된다. 이 워크플로들은 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 재사용 워크플로 안에서 checkout 은 호출한 레포/커밋을 받아온다.
      # 빌드 단계가 토큰을 주워갈 수 없도록 자격증명은 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 타입체크
        run: npm run typecheck

      # 배포가 Dockerfile 안에서 npm run build 를 돌리므로, 여기서 먼저 깨뜨린다.
      - name: 프로덕션 빌드
        run: npm run build
