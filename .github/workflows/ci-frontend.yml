# kwak-service-fe 검사
#
# 검사 3개를 각각 별도 job 으로 둔다. PR 체크 목록에 셋이 따로 뜨므로
# 어느 검사가 깨졌는지 들어가 보지 않아도 바로 보이고, 병렬로 돌아 더 빠르다.
# 서로 의존시키지 않은 것도 의도다 — lint 가 깨져도 빌드 결과를 같이 본다.
#
# GitHub 호스팅 러너에서만 돈다. self-hosted 에서 돌리면 안 된다 —
# fe 는 public 레포라 fork PR 이 self-hosted 러너에서 임의 코드를 실행할 수 있다.
name: CI (frontend)

on:
  workflow_call:
    inputs:
      node-version:
        description: 빌드에 사용할 Node 버전 (Dockerfile 의 node:20-alpine 과 맞춘다)
        type: string
        default: '20'

# GITHUB_TOKEN 은 읽기만 있으면 된다. 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  # 소스를 텍스트로 훑는다 (파일 단위)
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 재사용 워크플로 안에서 checkout 은 호출한 레포/커밋을 받아온다.
      # 빌드 단계가 토큰을 주워갈 수 없도록 자격증명은 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 타입을 계산해 맞춰본다 (프로젝트 전체).
  # vite 빌드는 타입을 검사하지 않으므로 이 단계가 따로 필요하다.
  typecheck:
    name: 타입체크
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # 실제로 번들을 만들어낸다. 배포가 Dockerfile 안에서 이 빌드를 돌리므로
  # 여기서 먼저 깨뜨린다. alias 미해결 같은 건 앞의 둘이 못 잡는다.
  build:
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
