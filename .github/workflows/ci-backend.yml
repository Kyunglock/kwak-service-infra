# kwak-service-be 검사
#
# 검사 2개를 각각 별도 job 으로 둔다. 마이그레이션 규칙 검사는 DB 가 필요 없어
# 서비스 컨테이너 기동을 기다리지 않고 몇 초 만에 결과가 나온다. V 번호 중복
# 같은 실수를 빌드 3분을 기다린 뒤에 알 이유가 없다.
name: CI (backend)

on:
  workflow_call:
    inputs:
      java-version:
        description: build.gradle 의 toolchain 과 맞춘다
        type: string
        default: '21'

# GITHUB_TOKEN 은 읽기만 있으면 된다. 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  # BE 는 Flyway 를 쓰지 않고 db/migration/V*.sql 을 수동 실행한다
  # (ARCHITECTURE.md). 도구가 순서를 강제해 주지 않으므로 파일명과 번호만이라도
  # 여기서 지킨다. DB 도 JDK 도 필요 없다.
  migrations:
    name: 마이그레이션 규칙
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 검사 스크립트는 infra 에 있다. 호출한 레포를 덮어쓰지 않도록
      # 별도 디렉터리로 받는다.
      - name: infra 스크립트 가져오기
        uses: actions/checkout@v7
        with:
          repository: Kyunglock/kwak-service-infra
          path: .infra
          persist-credentials: false

      - run: python3 .infra/scripts/check-migrations.py .

  build-test:
    name: 빌드 + 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # PortalApplicationTests 가 @SpringBootTest 라 전체 컨텍스트를 띄운다.
    # HikariCP 는 기동 시 커넥션을 만들므로 실제 MySQL 이 필요하다.
    # (Flyway 는 쓰지 않으므로 빈 스키마로 충분하다.)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: invdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      # application.yml / application-local.yml 의 placeholder 는 기본값이 없어
      # 하나라도 비면 컨텍스트가 뜨지 않는다. 전부 더미로 채운다.
      # 실제 값이 아니므로 외부 연동을 타는 코드는 CI 에서 실패하는 게 정상이고,
      # 현재 테스트는 전부 그 경로를 타지 않는다.
      - name: 빌드 + 테스트
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/invdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
          DB_USER: root
          DB_PASSWORD: ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          # 32자 이상이어야 한다
          JWT_SECRET: ci-only-dummy-jwt-secret-value-0123456789
          SYSTEM_API_KEY: ci-only-dummy-system-key
          KAKAO_CLIENT_ID: ci-dummy
          KAKAO_SECRET: ci-dummy
          NAVER_CLIENT_ID: ci-dummy
          NAVER_SECRET: ci-dummy
          REDIRECT_URI: http://localhost:8080/login/oauth2/code/kakao
          GRANT_TYPE: authorization_code
          APP_FRONT_URL: http://localhost:5173
          FINNHUB_API_KEY: ci-dummy
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
          retention-days: 7
