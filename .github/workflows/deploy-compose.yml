# docker compose 기반 서비스 배포 (kwak-service-be, collector 공용)
name: Deploy (compose)

on:
  workflow_call:
    inputs:
      compose-file:
        type: string
        default: docker-compose.yml
      # 예전 배포가 compose 밖에서 띄워 둔 컨테이너를 정리해야 할 때 쓴다.
      stale-containers:
        description: 공백으로 구분한 컨테이너 이름 목록
        type: string
        default: ''
      requires-env-file:
        description: compose 가 env_file 로 .env 를 요구하면 true
        type: boolean
        default: false

concurrency:
  group: deploy-compose-${{ github.repository }}
  cancel-in-progress: false

# GITHUB_TOKEN 은 읽기만 있으면 된다. 이 워크플로들은 커밋·이슈·패키지를 건드리지 않는다.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # checkout 은 기본으로 git clean -ffdx 를 돌려 작업공간을 비운다.
      # 러너에 수동으로 둔 compose 파일이 있어도 남지 않으므로, 레포에 없으면 배포는 불가능하다.
      - name: compose 파일 확인
        run: |
          if [ ! -f "${{ inputs.compose-file }}" ]; then
            echo "::error::${{ inputs.compose-file }} 이 레포에 없습니다."
            echo "::error::checkout 이 작업공간을 비우므로 러너에 수동으로 둔 파일은 쓸 수 없습니다. 레포에 커밋하세요."
            exit 1
          fi
          docker compose -f "${{ inputs.compose-file }}" config >/dev/null

      - name: .env 확인
        if: inputs.requires-env-file
        run: |
          if [ ! -f .env ]; then
            echo "::error::compose 가 .env 를 요구하는데 러너 작업공간에 없습니다."
            exit 1
          fi

      - name: 기존 컨테이너 정리
        run: |
          docker compose -f "${{ inputs.compose-file }}" down --remove-orphans
          for c in ${{ inputs.stale-containers }}; do
            docker rm -f "$c" 2>/dev/null || true
          done

      - name: 빌드 + 기동
        run: docker compose -f "${{ inputs.compose-file }}" up --build -d

      - name: 기동 확인
        run: |
          sleep 10
          docker compose -f "${{ inputs.compose-file }}" ps
          if docker compose -f "${{ inputs.compose-file }}" ps --status exited --quiet | grep -q .; then
            echo "::error::기동 직후 종료된 컨테이너가 있습니다."
            docker compose -f "${{ inputs.compose-file }}" logs --tail 50
            exit 1
          fi

      - name: 사용하지 않는 이미지 정리
        if: always()
        run: docker image prune -f
